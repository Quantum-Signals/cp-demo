log4j.rootLogger=INFO, stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
log4j.appender.kafka_appender=org.apache.kafka.log4jappender.KafkaLog4jAppender
log4j.appender.kafka_appender.layout=io.confluent.common.logging.log4j.StructuredJsonLayout
log4j.appender.kafka_appender.BrokerList=kafka1:10091
log4j.appender.kafka_appender.Topic=ksql-clusterksql_processing_log
log4j.appender.kafka_appender.SyncSend=false
log4j.appender.kafka_appender.SecurityProtocol=SASL_SSL
log4j.appender.kafka_appender.SaslMechanism=OAUTHBEARER
log4j.appender.kafka_appender.SaslLoginCallbackHandlerClass=io.confluent.kafka.clients.plugins.auth.token.TokenUserLoginCallbackHandler
log4j.appender.kafka_appender.SaslJaasConfig=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required username="ksqlDBAdmin" password="ksqlDBAdmin" metadataServerUrls="https://kafka1:8091";
log4j.appender.kafka_appender.SslTruststoreLocation=/etc/kafka/secrets/kafka.controlCenterAndKsqlDBServer.truststore.jks
log4j.appender.kafka_appender.SslTruststorePassword=confluent
log4j.logger.processing=ERROR, kafka_appender
